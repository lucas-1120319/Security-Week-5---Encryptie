<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Encryption</title>
</head>
<body>
    <div class="box">
        <h2>1. Bericht Versleutelen & Versturen</h2>
        <input type="text" id="message" placeholder="Typ je bericht...">
        <input type="password" id="encryptPassword" placeholder="Wachtwoord">
        <button onclick="handleEncrypt()">Verstuur Bericht</button>
    </div>



    <div class="box">
        <h2>3. Postvak IN</h2>
        <div id="inbox" class="hidden">
            <div id="inbox-item" onclick="showDecryptForm()">
                📩 <strong>U heeft 1 nieuw versleuteld bericht!</strong> (Klik om te openen)
            </div>
        </div>

        <!-- Formulier dat verschijnt na klikken op het bericht -->
        <div id="decryptSection" class="hidden" style="margin-top: 15px;">
            <p>Vul het wachtwoord in om dit bericht te lezen:</p>
            <input type="password" id="DecryptPassword" placeholder="Wachtwoord">
            <button onclick="handleDecrypt()">Ontsleutel</button>

            <h3>Bericht inhoud:</h3>
            <p><strong id="output" style="color: green;"></strong></p>
        </div>
    </div>
    <script type="application/javascript" src="crypting.js"></script>

</body>
</html>
