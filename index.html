<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Encryption</title>
</head>
<body>
    <input type="text" id="message" placeholder="Vul een tekst in om te encrypten">
    <input type="password" id="EncryptPassword" placeholder="Vul een wachtwoord in">
    <input type="password" id="DecryptPassword" placeholder="Vul een wachtwoord in">

    <button onclick="handleEncrypt()">Encrypt</button>
    <button onclick="handleDecrypt()">Decrypt</button>

    <p><span id="output"></span></p>

    <script>
        let globalKey = null;
        let globalIv = null;
        let globalSalt = null;
        let globalEncryptedBuffer = null;

        async function handleEncrypt() {
            const messageText = document.getElementById('message').value;
            const EncryptPassword = document.getElementById('EncryptPassword').value;
            try {
                const EncrptPasswordBuffer = new TextEncoder().encode(EncryptPassword);
                const baseKey = await window.crypto.subtle.importKey(
                    "raw",
                    EncrptPasswordBuffer,
                    { name: "PBKDF2" },
                    false,
                    ["deriveKey"]
                );
                globalSalt = window.crypto.getRandomValues(new Uint8Array(16));
                // Leid de echte AES-GCM sleutel af uit het wachtwoord + salt
                globalKey = await window.crypto.subtle.deriveKey(
                    {
                        name: "PBKDF2",
                        salt: globalSalt,
                        iterations: 100000,
                        hash: "SHA-256"
                    },
                    baseKey,
                    { name: "AES-GCM", length: 256 },
                    true,
                    ["encrypt", "decrypt"]
                );

                // Zet originele tekst om naar bytes voor de encryptie
                const encodedMessage =  new TextEncoder().encode(messageText);

                //  Genereer een unieke IV van 12 bytes
                globalIv = window.crypto.getRandomValues(new Uint8Array(12));

                //  Voer de encryptie uit
                globalEncryptedBuffer = await window.crypto.subtle.encrypt(
                    {
                        name: "AES-GCM",
                        iv: globalIv
                    },
                    globalKey,
                    encodedMessage
                );
                

                console.log("Encryptie met wachtwoord gelukt!", globalEncryptedBuffer);
                alert("Encryptie geslaagd!");
            } catch (error) {
                console.error("Fout tijdens encryptie:", error);
            }
        }

        async function handleDecrypt() {
            // Check of we wel iets hebben om te ontsleutelen
            console.log(globalKey, globalIv, globalEncryptedBuffer, globalSalt);
            if (!globalKey || !globalIv || !globalEncryptedBuffer || !globalSalt) {
                alert("Klik eerst op 'Encrypt' voordat je kunt ontsleutelen!");
                return;
            }
            const DecryptPassword = document.getElementById('DecryptPassword').value;

            try {
                const DecryptPasswordBuffer = new TextEncoder().encode(DecryptPassword);

                const baseKey = await window.crypto.subtle.importKey(
                    "raw",
                    DecryptPasswordBuffer,
                    { name: "PBKDF2" },
                    false,
                    ["deriveKey"]
                );


                    // Decryptie uitvoeren met dezelfde sleutel, iv en buffer
                   const decryptionKey = await window.crypto.subtle.deriveKey(
                        {
                            name: "PBKDF2",
                            salt: globalSalt,
                            iterations: 100000,
                            hash: "SHA-256"
                        },
                        baseKey,
                        { name: "AES-GCM", length: 256 },
                        true,
                        ["encrypt", "decrypt"]
                    );


                const decryptedBuffer = await window.crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: globalIv
                    },
                    decryptionKey,
                    globalEncryptedBuffer
                );


                // 4. Bytes omzetten naar leesbare tekst
                const decryptedText = new TextDecoder().decode(decryptedBuffer);
                document.getElementById('output').innerText = decryptedText;

            } catch (error) {
                console.error("Fout tijdens decryptie:", error);
                alert("Decryptie mislukt!");
            }
        }
    </script>
</body>
</html>
